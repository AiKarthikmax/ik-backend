<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluent/192/000000/finance.png" />
    <title>iK Personal Finance Management</title>
  </head>
  <body class="bg-[#0b0f19] text-gray-100 selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").then((reg) => {
            console.log("Service Worker registered successfully:", reg.scope);
          }).catch((err) => {
            console.warn("Service Worker registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
